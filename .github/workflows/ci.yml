name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установки (root)
        run: npm ci

      - name: Установки (worker)
        run: npm --prefix worker ci

      - name: Установки (web)
        run: npm --prefix web ci

      - name: TypeScript (worker)
        run: node worker/node_modules/typescript/bin/tsc --noEmit -p worker

      - name: TypeScript (web)
        run: node web/node_modules/typescript/bin/tsc --noEmit -p web

      - name: Vitest
        run: node node_modules/vitest/vitest.mjs run
